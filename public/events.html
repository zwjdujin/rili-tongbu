<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>事件总览 · 日历同步</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6;
      --ok: #22c55e; --err: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      padding: 10px 6px; max-width: 960px; margin: 0 auto;
    }
    h1 { font-size: 18px; margin-bottom: 2px; }
    .sub { color: var(--muted); font-size: 11px; margin-bottom: 12px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px; margin-bottom: 8px;
    }
    .card h2 { font-size: 12px; margin-bottom: 6px; color: var(--accent); }
    input, select, button, textarea {
      font-size: 12px; padding: 4px 6px; border-radius: 3px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    button { background: var(--accent); border: none; cursor: pointer; color: #fff; }
    button.ghost { background: transparent; border: 1px solid var(--border); }
    button.danger { background: var(--err); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .row label { flex: 0 0 80px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { text-align: left; padding: 3px 5px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    .muted { color: var(--muted); font-size: 10px; }
    .ok { color: var(--ok); } .err { color: var(--err); }
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--card); border: 1px solid var(--border); padding: 10px 16px;
      border-radius: 8px; display: none; font-size: 13px; z-index: 10;
    }
    .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .calendar-nav button { padding: 4px 8px; font-size: 12px; }
    .calendar-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
      margin-bottom: 8px;
      max-height: 450px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
    }
    .event-dot {
      position: absolute; bottom: 2px; width: 4px; height: 4px;
      background: var(--accent); border-radius: 50%;
    }
    .calendar-header { 
      color: var(--muted); 
      font-size: 10px; 
      text-align: center; 
      padding: 3px 0;
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .calendar-day {
      aspect-ratio: 1; border: 1px solid var(--border); border-radius: 2px;
      padding: 1px; cursor: pointer; position: relative;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; transition: all 0.2s;
      font-size: 10px;
      min-height: 50px;
    }
    .calendar-day:hover { background: var(--bg); }
    .calendar-day.today { border: 1px solid var(--accent); }
    .calendar-day.other-month { color: var(--muted); opacity: .5; }
    .calendar-day.selected { background: var(--accent); }
    .calendar-day > div:first-child { 
      font-weight: 500; 
      margin-bottom: 1px; 
      font-size: 11px;
      line-height: 1.2;
    }
    .calendar-day > div:last-child { 
      font-size: 8px; 
      line-height: 1.1;
      margin-top: 1px;
    }
    .lunar { font-size: 8px; line-height: 1.1; color: var(--muted); margin-top: 1px; }
    .modal {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: none; align-items: center;
      justify-content: center; z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; max-width: 500px; width: 90%;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .close-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; margin-bottom: 3px; font-size: 12px; }
    textarea { resize: vertical; min-height: 60px; }
    .color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-option {
      width: 24px; height: 24px; border-radius: 4px; cursor: pointer;
      border: 2px solid transparent;
    }
    .color-option.selected { border-color: var(--text); }
  </style>
</head>
<body>
  <div id="app-view">
    <h1>📅 事件总览</h1>
    <p class="sub">日历同步 v0.0.7 · <button class="ghost" id="back-btn" style="padding:4px 10px;font-size:12px">返回控制台</button></p>

    <div class="card">
      <h2>月历视图</h2>
      <div class="calendar-nav">
        <div>
          <button id="prev-month">◀</button>
          <span id="current-month" style="margin:0 16px;font-size:16px"></span>
          <button id="next-month">▶</button>
        </div>
        <div>
          <button id="today-btn">今天</button>
          <select id="year-select" style="margin-left:8px"></select>
          <select id="month-select" style="margin-left:8px"></select>
        </div>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
    </div>

    <div class="card">
      <h2>事件列表</h2>
      <div class="row" style="margin-bottom:0">
        <button id="add-event-btn">+ 添加事件</button>
        <select id="calendar-filter">
          <option value="">全部日历</option>
        </select>
        <input id="search-input" placeholder="搜索事件..." style="flex:1;min-width:200px" />
      </div>
      <table id="events-table">
        <thead><tr><th>标题</th><th>时间</th><th>日历</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="event-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">添加事件</h2>
        <button class="close-btn" id="close-modal">×</button>
      </div>
      <form id="event-form">
        <div class="form-group">
          <label>标题 *</label>
          <input type="text" id="event-title" required />
        </div>
        <div class="form-group">
          <label>日历</label>
          <select id="event-calendar" required></select>
        </div>
        <div class="row">
          <div style="flex:1">
            <label>开始时间</label>
            <input type="datetime-local" id="event-start" required />
          </div>
          <div style="flex:1">
            <label>结束时间</label>
            <input type="datetime-local" id="event-end" required />
          </div>
        </div>
        <div class="form-group">
          <label>全天</label>
          <input type="checkbox" id="event-allday" />
        </div>
        <div class="form-group">
          <label>地点</label>
          <input type="text" id="event-location" />
        </div>
        <div class="form-group">
          <label>描述</label>
          <textarea id="event-description"></textarea>
        </div>
        <div class="form-group">
          <label>提醒</label>
          <select id="event-reminder">
            <option value="">无提醒</option>
            <option value="5">5分钟前</option>
            <option value="15">15分钟前</option>
            <option value="30">30分钟前</option>
            <option value="60">1小时前</option>
          </select>
        </div>
        <div class="form-group">
          <label>重复</label>
          <select id="event-recurrence">
            <option value="">不重复</option>
            <option value="DAILY">每天</option>
            <option value="WEEKLY">每周</option>
            <option value="MONTHLY">每月</option>
            <option value="YEARLY">每年</option>
          </select>
        </div>
        <div class="form-group">
          <label>颜色</label>
          <div class="color-picker" id="color-picker"></div>
        </div>
        <div class="row" style="justify-content:flex-end;gap:8px;margin-top:16px">
          <button type="button" class="ghost" id="cancel-btn">取消</button>
          <button type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const TOKEN = localStorage.getItem('rt_admin_token') || '';
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let selectedDate = null;
let editingEvent = null;

function toast(msg, ok = true) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.display = 'block';
  t.style.color = ok ? 'var(--ok)' : 'var(--err)';
  setTimeout(() => (t.style.display = 'none'), 2500);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN, ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// 农历转换（简化版，只支持部分年份）
function getLunarDate(date) {
  const lunarMonths = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];
  const lunarDays = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
                    '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
                    '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];
  
  // 这里使用简化的农历计算，实际项目中建议使用成熟的 lunar 库
  // 当前为演示使用，显示固定的农历日期
  const monthIndex = Math.floor((date.getMonth() + 9) % 12);
  const dayIndex = Math.min(date.getDate() - 1, lunarDays.length - 1);
  
  return { month: lunarMonths[monthIndex], day: lunarDays[dayIndex] };
}

function formatDate(date) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}

function renderCalendar() {
  const grid = document.getElementById('calendar-grid');
  const year = currentYear;
  const month = currentMonth;
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const prevLastDay = new Date(year, month, 0);
  const startDay = firstDay.getDay();
  const endDay = lastDay.getDay();
  
  const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
  let html = '';
  
  // 星期表头
  weekDays.forEach(day => {
    html += `<div class="calendar-header">${day}</div>`;
  });
  
  // 上月日期
  for (let i = startDay - 1; i >= 0; i--) {
    const date = new Date(year, month - 1, prevLastDay.getDate() - i);
    const lunar = getLunarDate(date);
    html += `<div class="calendar-day other-month">
      <div>${date.getDate()}</div>
      <div class="lunar">${lunar.day}</div>
    </div>`;
  }
  
  // 当月日期
  for (let day = 1; day <= lastDay.getDate(); day++) {
    const date = new Date(year, month, day);
    const today = new Date();
    const isToday = formatDate(date) === formatDate(today);
    const lunar = getLunarDate(date);
    const isSelected = selectedDate && formatDate(date) === formatDate(selectedDate);
    
    html += `<div class="calendar-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-date="${date.toISOString()}">
      <div>${day}</div>
      <div class="lunar">${lunar.day}</div>
    </div>`;
  }
  
  // 下月日期
  for (let i = 1; i < 7 - endDay; i++) {
    const date = new Date(year, month + 1, i);
    const lunar = getLunarDate(date);
    html += `<div class="calendar-day other-month">
      <div>${date.getDate()}</div>
      <div class="lunar">${lunar.day}</div>
    </div>`;
  }
  
  grid.innerHTML = html;
  document.getElementById('current-month').textContent = `${year}年${month + 1}月`;
  
  // 绑定日期点击
  grid.querySelectorAll('.calendar-day:not(.other-month)').forEach(day => {
    day.onclick = () => {
      selectedDate = new Date(day.dataset.date);
      renderCalendar();
      loadEvents();
    };
  });
}

async function loadCalendars() {
  try {
    const { calendars } = await api('/api/calendars');
    const filter = document.getElementById('calendar-filter');
    filter.innerHTML = '<option value="">全部日历</option>' + 
      calendars.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    const modalCalendar = document.getElementById('event-calendar');
    modalCalendar.innerHTML = calendars.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  } catch (error) {
    console.error('加载日历失败:', error);
    const filter = document.getElementById('calendar-filter');
    filter.innerHTML = '<option value="">加载失败</option>';
    const modalCalendar = document.getElementById('event-calendar');
    modalCalendar.innerHTML = '<option value="">加载失败</option>';
  }
}

async function loadEvents() {
  const filter = document.getElementById('calendar-filter').value;
  const search = document.getElementById('search-input').value;
  let url = '/api/events';
  const params = new URLSearchParams();
  if (filter) params.append('calendar_id', filter);
  if (search) params.append('search', search);
  if (params.toString()) url += '?' + params;
  
  try {
    const { events } = await api(url);
    const tbody = document.getElementById('events-table').querySelector('tbody');
    tbody.innerHTML = events.slice(0, 100).map(e => {
      const startDate = new Date(e.start_at);
      const endDate = new Date(e.end_at);
      const startStr = e.all_day 
        ? startDate.toLocaleDateString('zh-CN')
        : startDate.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      const endStr = e.all_day 
        ? endDate.toLocaleDateString('zh-CN')
        : endDate.toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      
      return `<tr>
        <td>${e.title}</td>
        <td>${startStr} ${!e.all_day ? '-' + endStr : ''}</td>
        <td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${e.calendar_color || '#3b82f6'}"></span> ${e.calendar_name}</td>
        <td><button class="danger" style="padding:2px 6px;font-size:11px" data-id="${e.id}">删除</button></td>
      </tr>`;
    }).join('') || '<tr><td colspan="4" class="muted">暂无事件</td></tr>';
    
    // 绑定删除按钮
    tbody.querySelectorAll('button').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('确定删除此事件？')) return;
        try {
          await api('/api/events/' + btn.dataset.id, { method: 'DELETE' });
          toast('事件已删除');
          loadEvents();
        } catch (e) { 
          toast('删除失败：' + e.message, false); 
        }
      };
    });
  } catch (error) {
    console.error('加载事件失败:', error);
    const tbody = document.getElementById('events-table').querySelector('tbody');
    tbody.innerHTML = '<tr><td colspan="4" class="muted">加载失败：' + error.message + '</td></tr>';
  }
}

// 事件表单处理
document.getElementById('event-form').onsubmit = async (e) => {
  e.preventDefault();
  const eventData = {
    calendar_id: document.getElementById('event-calendar').value,
    title: document.getElementById('event-title').value,
    start_at: new Date(document.getElementById('event-start').value).getTime(),
    end_at: new Date(document.getElementById('event-end').value).getTime(),
    all_day: document.getElementById('event-allday').checked,
    location: document.getElementById('event-location').value,
    description: document.getElementById('event-description').value,
    reminder_minutes: document.getElementById('event-reminder').value ? parseInt(document.getElementById('event-reminder').value) : null,
    recurrence: document.getElementById('event-recurrence').value || null,
  };
  
  try {
    if (editingEvent) {
      await api('/api/events/' + editingEvent.id, { method: 'PUT', body: JSON.stringify(eventData) });
      toast('事件已更新');
    } else {
      await api('/api/events', { method: 'POST', body: JSON.stringify(eventData) });
      toast('事件已添加');
    }
    closeModal();
    loadEvents();
  } catch (err) {
    toast('保存失败：' + err.message, false);
  }
};

function openModal(event = null) {
  editingEvent = event;
  document.getElementById('modal-title').textContent = event ? '编辑事件' : '添加事件';
  document.getElementById('event-modal').classList.add('active');
  
  if (event) {
    document.getElementById('event-title').value = event.title;
    document.getElementById('event-calendar').value = event.calendar_id;
    document.getElementById('event-start').value = new Date(event.start_at).toISOString().slice(0, 16);
    document.getElementById('event-end').value = new Date(event.end_at).toISOString().slice(0, 16);
    document.getElementById('event-allday').checked = event.all_day;
    document.getElementById('event-location').value = event.location || '';
    document.getElementById('event-description').value = event.description || '';
    document.getElementById('event-reminder').value = event.reminder_minutes || '';
    document.getElementById('event-recurrence').value = event.recurrence || '';
  } else {
    document.getElementById('event-form').reset();
    if (selectedDate) {
      const date = new Date(selectedDate);
      document.getElementById('event-start').value = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 9, 0).toISOString().slice(0, 16);
      document.getElementById('event-end').value = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 10, 0).toISOString().slice(0, 16);
    }
  }
}

function closeModal() {
  document.getElementById('event-modal').classList.remove('active');
  editingEvent = null;
}

// 事件绑定
document.getElementById('add-event-btn').onclick = () => openModal();
document.getElementById('close-modal').onclick = closeModal;
document.getElementById('cancel-btn').onclick = closeModal;
document.getElementById('event-modal').onclick = (e) => {
  if (e.target.id === 'event-modal') closeModal();
};

document.getElementById('prev-month').onclick = () => {
  currentMonth--;
  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }
  renderCalendar();
  loadEvents();
};

document.getElementById('next-month').onclick = () => {
  currentMonth++;
  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }
  renderCalendar();
  loadEvents();
};

document.getElementById('today-btn').onclick = () => {
  const today = new Date();
  currentYear = today.getFullYear();
  currentMonth = today.getMonth();
  selectedDate = today;
  
  // 更新年月选择器
  document.getElementById('year-select').value = currentYear;
  document.getElementById('month-select').value = currentMonth;
  
  renderCalendar();
  loadEvents();
};

// 年月选择器
function populateYearMonth() {
  const yearSelect = document.getElementById('year-select');
  const monthSelect = document.getElementById('month-select');
  const currentYear = new Date().getFullYear();
  
  yearSelect.innerHTML = '';
  for (let y = currentYear - 5; y <= currentYear + 5; y++) {
    yearSelect.innerHTML += `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y}年</option>`;
  }
  
  monthSelect.innerHTML = '';
  for (let m = 0; m < 12; m++) {
    monthSelect.innerHTML += `<option value="${m}" ${m === new Date().getMonth() ? 'selected' : ''}>${m + 1}月</option>`;
  }
}

document.getElementById('year-select').onchange = () => {
  currentYear = parseInt(document.getElementById('year-select').value);
  renderCalendar();
  loadEvents();
};

document.getElementById('month-select').onchange = () => {
  currentMonth = parseInt(document.getElementById('month-select').value);
  renderCalendar();
  loadEvents();
};

document.getElementById('calendar-filter').onchange = loadEvents;
document.getElementById('search-input').oninput = loadEvents;

// 返回控制台
document.getElementById('back-btn').onclick = () => {
  window.location.href = '/';
};

// 初始化
populateYearMonth();
renderCalendar();
loadCalendars();
loadEvents();
</script>
</body>
</html>
