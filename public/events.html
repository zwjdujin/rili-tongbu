<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>事件总览 · 日历同步</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6;
      --ok: #22c55e; --err: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      padding: 10px; max-width: 980px; margin: 0 auto;
    }
    h1 { font-size: 18px; }
    .page-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .page-head .sub { color: var(--muted); font-size: 12px; margin-left: 10px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; margin-bottom: 10px;
    }
    .card h2 { font-size: 13px; margin-bottom: 8px; color: var(--accent); }
    input, select, button, textarea {
      font-size: 13px; padding: 5px 8px; border-radius: 5px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      outline: none;
    }
    button { background: var(--accent); border: none; cursor: pointer; color: #fff; }
    button.ghost { background: transparent; border: 1px solid var(--border); }
    button.danger { background: var(--err); }
    .muted { color: var(--muted); font-size: 12px; }
    a { color: var(--accent); }

    /* ---- 月历：占满一屏，6 行平分高度 ---- */
    .cal-nav {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
    }
    .cal-nav .title { font-size: 15px; min-width: 110px; text-align: center; }
    .cal-nav .title button { padding: 2px 8px; font-size: 13px; }
    .cal-nav .right { display: flex; gap: 6px; align-items: center; }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: auto repeat(6, minmax(0, 1fr));
      gap: 2px;
      /* 一屏高度：视口高减去页面头部/导航等固定区域 */
      height: calc(100vh - 175px);
      height: calc(100dvh - 175px);
      min-height: 340px;
      max-height: 780px;
    }
    .cal-week {
      color: var(--muted); font-size: 11px; text-align: center;
      padding: 3px 0; border-bottom: 1px solid var(--border);
    }
    .cal-day {
      border: 1px solid var(--border); border-radius: 5px;
      cursor: pointer; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1px; min-height: 0; min-width: 0;
      background: var(--card);
    }
    .cal-day:hover { border-color: var(--accent); }
    .cal-day.dim { opacity: .35; }
    .cal-day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .cal-day.sel { background: var(--accent); }
    .cal-day.sel .d-lunar, .cal-day.sel .d-num { color: #fff; }
    .d-num { font-size: clamp(11px, 1.5vw, 14px); font-weight: 600; line-height: 1.1; }
    .d-lunar { font-size: clamp(8px, 1vw, 11px); line-height: 1.1; color: var(--muted); }

    /* ---- 事件列表 ---- */
    .ev-toolbar {
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
      margin-bottom: 8px;
    }
    .ev-toolbar input[type="text"] { flex: 1; min-width: 140px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    td .op { padding: 2px 7px; font-size: 11px; margin-right: 4px; }
    .cal-chip {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 3px; vertical-align: middle; margin-right: 4px;
    }

    /* ---- 弹窗 ---- */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: none; align-items: center; justify-content: center; z-index: 100;
      padding: 12px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; width: 100%; max-width: 440px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .modal-header h2 { font-size: 15px; }
    .close-btn { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
    .form-group { margin-bottom: 9px; }
    .form-group label { display: block; font-size: 12px; margin-bottom: 3px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; }
    .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    textarea { resize: vertical; min-height: 52px; }
    .check-line { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .check-line input { width: auto; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

    #toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: var(--card); border: 1px solid var(--border); padding: 8px 16px;
      border-radius: 8px; display: none; font-size: 13px; z-index: 200;
    }
  </style>
</head>
<body>
  <div class="page-head">
    <div style="display:flex;align-items:center">
      <h1>📅 事件总览</h1>
      <span class="sub">rili-tongbu</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <a href="/">← 返回控制台</a>
    </div>
  </div>

  <div class="card">
    <div class="cal-nav">
      <div class="title">
        <button id="prev-month" class="ghost">◀</button>
        <span id="current-month" style="display:inline-block;min-width:90px"></span>
        <button id="next-month" class="ghost">▶</button>
      </div>
      <div class="right">
        <button id="today-btn" class="ghost">今天</button>
        <select id="year-select"></select>
        <select id="month-select"></select>
        <button id="add-event-btn">＋ 添加事件</button>
      </div>
    </div>
    <div class="cal-grid" id="calendar-grid"></div>
    <p class="muted" id="events-count" style="margin-top:6px">—</p>
  </div>

  <div class="card">
    <h2>事件列表</h2>
    <div class="ev-toolbar">
      <select id="calendar-filter"><option value="">全部日历</option></select>
      <input type="text" id="search-input" placeholder="搜索标题 / 描述..." />
    </div>
    <table id="events-table">
      <thead><tr><th>日期</th><th>时间</th><th>标题</th><th>日历</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="event-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">添加事件</h2>
        <button class="close-btn" id="close-modal">×</button>
      </div>
      <form id="event-form">
        <div class="form-group">
          <label>标题 *</label>
          <input type="text" id="event-title" required />
        </div>
        <div class="form-group">
          <label>日历</label>
          <select id="event-calendar"></select>
        </div>
        <div class="form-2col">
          <div class="form-group">
            <label>开始 *</label>
            <input type="datetime-local" id="event-start" required />
          </div>
          <div class="form-group">
            <label>结束 *</label>
            <input type="datetime-local" id="event-end" required />
          </div>
        </div>
        <div class="form-group check-line">
          <input type="checkbox" id="event-allday" />
          <label for="event-allday" style="margin:0">全天事件</label>
        </div>
        <div class="form-group">
          <label>地点</label>
          <input type="text" id="event-location" />
        </div>
        <div class="form-group">
          <label>描述</label>
          <textarea id="event-description"></textarea>
        </div>
        <div class="form-2col">
          <div class="form-group">
            <label>提醒</label>
            <select id="event-reminder">
              <option value="">无提醒</option>
              <option value="5">提前 5 分钟</option>
              <option value="15">提前 15 分钟</option>
              <option value="30">提前 30 分钟</option>
              <option value="60">提前 1 小时</option>
              <option value="1440">提前 1 天</option>
            </select>
          </div>
          <div class="form-group">
            <label>重复</label>
            <select id="event-recurrence">
              <option value="">不重复</option>
              <option value="DAILY">每天</option>
              <option value="WEEKLY">每周</option>
              <option value="MONTHLY">每月</option>
              <option value="YEARLY">每年</option>
            </select>
          </div>
        </div>
        <div class="modal-btns">
          <button type="button" class="ghost" id="cancel-btn">取消</button>
          <button type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const TOKEN = localStorage.getItem('rt_admin_token') || '';
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let selectedDate = null;   // Date | null
let editingEvent = null;   // 当前编辑的事件对象

/* ---------------- 农历（1900-2100 标准数据表） ---------------- */
const LUNAR_INFO = [
0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,
0x0d520];
const LUNAR_MONTHS = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const LUNAR_DAYS = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

function lunarLeapMonth(y) { return LUNAR_INFO[y - 1900] & 0xf; }
function lunarLeapDays(y) { return lunarLeapMonth(y) ? ((LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29) : 0; }
function lunarMonthDays(y, m) { return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
function lunarYearDays(y) {
  let sum = 348;
  for (let i = 0x8000; i > 0x8; i >>= 1) sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0;
  return sum + lunarLeapDays(y);
}
function solarToLunar(y, m, d) {
  if (y < 1901 || y > 2100) return null;
  let offset = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000);
  let ly = 1900, temp = 0;
  for (; ly < 2101 && offset > 0; ly++) { temp = lunarYearDays(ly); offset -= temp; }
  if (offset < 0) { offset += temp; ly--; }
  const leap = lunarLeapMonth(ly);
  let isLeap = false, lm = 1;
  for (; lm < 13 && offset > 0; lm++) {
    if (leap > 0 && lm === leap + 1 && !isLeap) {
      --lm; isLeap = true; temp = lunarLeapDays(ly);
    } else {
      temp = lunarMonthDays(ly, lm);
    }
    if (isLeap && lm === leap + 1) isLeap = false;
    offset -= temp;
  }
  if (offset === 0 && leap > 0 && lm === leap + 1) {
    if (isLeap) { isLeap = false; } else { isLeap = true; --lm; }
  }
  if (offset < 0) { offset += temp; --lm; }
  return { year: ly, month: lm, day: offset + 1, isLeap };
}
function lunarText(date) {
  const l = solarToLunar(date.getFullYear(), date.getMonth() + 1, date.getDate());
  if (!l) return '';
  if (l.day === 1) return (l.isLeap ? '闰' : '') + LUNAR_MONTHS[l.month - 1] + '月';
  return LUNAR_DAYS[l.day - 1];
}

/* ---------------- 工具 ---------------- */
function fmtYMD(d) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
// 毫秒时间戳 → datetime-local 输入框的本地时间值（避免 toISOString 的时区偏移）
function toLocalInput(ms) {
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function toast(msg, ok = true) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  t.style.color = ok ? 'var(--ok)' : 'var(--err)';
  setTimeout(() => (t.style.display = 'none'), 2200);
}
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN, ...(opts.headers || {}) },
  });
  if (res.status === 401) { location.href = '/'; throw new Error('未登录'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.detail || ('HTTP ' + res.status));
  return data;
}

/* ---------------- 月历 ---------------- */
function renderCalendar() {
  const grid = $('calendar-grid');
  const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
  const first = new Date(currentYear, currentMonth, 1);
  const gridStart = new Date(currentYear, currentMonth, 1 - first.getDay());
  const todayStr = fmtYMD(new Date());
  const selStr = selectedDate ? fmtYMD(selectedDate) : '';

  let html = weekNames.map((w) => `<div class="cal-week">${w}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const ds = fmtYMD(d);
    const cls = [
      'cal-day',
      d.getMonth() === currentMonth ? '' : 'dim',
      ds === todayStr ? 'today' : '',
      ds === selStr ? 'sel' : '',
    ].filter(Boolean).join(' ');
    html += `<div class="${cls}" data-date="${ds}">
      <span class="d-num">${d.getDate()}</span>
      <span class="d-lunar">${lunarText(d)}</span>
    </div>`;
  }
  grid.innerHTML = html;
  $('current-month').textContent = `${currentYear}年${currentMonth + 1}月`;

  grid.querySelectorAll('.cal-day').forEach((el) => {
    el.onclick = () => {
      const [y, m, dd] = el.dataset.date.split('-').map(Number);
      const clicked = fmtYMD(selectedDate || new Date(0));
      selectedDate = el.dataset.date === clicked ? null : new Date(y, m - 1, dd);
      renderCalendar();
      loadEvents();
    };
  });
}
function shiftMonth(delta) {
  let m = currentMonth + delta, y = currentYear;
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  currentMonth = m; currentYear = y;
  selectedDate = null;
  syncYearMonthSelects();
  renderCalendar();
  loadEvents();
}
function syncYearMonthSelects() {
  $('year-select').value = String(currentYear);
  $('month-select').value = String(currentMonth);
}
function populateYearMonth() {
  const thisYear = new Date().getFullYear();
  let yh = '';
  for (let y = thisYear - 10; y <= thisYear + 10; y++) yh += `<option value="${y}">${y}年</option>`;
  $('year-select').innerHTML = yh;
  let mh = '';
  for (let m = 1; m <= 12; m++) mh += `<option value="${m - 1}">${m}月</option>`;
  $('month-select').innerHTML = mh;
  syncYearMonthSelects();
}

/* ---------------- 事件 ---------------- */
async function loadCalendars() {
  const { calendars } = await api('/api/calendars');
  const opts = calendars.map((c) => `<option value="${c.id}">${c.name}</option>`).join('');
  $('calendar-filter').innerHTML = '<option value="">全部日历</option>' + opts;
  $('event-calendar').innerHTML = opts || '<option value="default">默认</option>';
}

async function loadEvents() {
  const tbody = $('events-table').querySelector('tbody');
  try {
    const params = new URLSearchParams();
    if ($('calendar-filter').value) params.append('calendar_id', $('calendar-filter').value);
    if ($('search-input').value.trim()) params.append('search', $('search-input').value.trim());
    const qs = params.toString();
    const { events } = await api('/api/events' + (qs ? '?' + qs : ''));

    // 客户端过滤出当月（或选中日期）的事件
    const rangeStart = selectedDate
      ? new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate()).getTime()
      : new Date(currentYear, currentMonth, 1).getTime();
    const rangeEnd = selectedDate ? rangeStart + 86400000 : new Date(currentYear, currentMonth + 1, 1).getTime();
    const monthEvents = (events || []).filter((e) => e.end_at >= rangeStart && e.start_at < rangeEnd)
      .sort((a, b) => a.start_at - b.start_at);

    const scope = selectedDate
      ? `${currentMonth + 1}月${selectedDate.getDate()}日`
      : `${currentYear}年${currentMonth + 1}月`;
    $('events-count').textContent = selectedDate
      ? `${scope} 当天共 ${monthEvents.length} 个事件（再次点击日期可取消筛选）`
      : `${scope} 共 ${monthEvents.length} 个事件`;

    tbody.innerHTML = monthEvents.map((e) => {
      const s = new Date(e.start_at);
      const p = (n) => String(n).padStart(2, '0');
      const dateStr = `${s.getMonth() + 1}/${s.getDate()}`;
      const timeStr = e.all_day ? '全天' : `${p(s.getHours())}:${p(s.getMinutes())}`;
      return `<tr>
        <td>${dateStr}</td>
        <td>${timeStr}</td>
        <td>${e.title}</td>
        <td><span class="cal-chip" style="background:${e.calendar_color || '#3b82f6'}"></span>${e.calendar_name || e.calendar_id}</td>
        <td>
          <button class="ghost op ev-edit" data-id="${e.id}">编辑</button>
          <button class="danger op ev-del" data-id="${e.id}">删除</button>
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="5" class="muted">${selectedDate ? '当天暂无事件' : '当月暂无事件'}</td></tr>`;

    tbody.querySelectorAll('.ev-del').forEach((btn) => {
      btn.onclick = async () => {
        if (!confirm('确定删除此事件？删除会同步到所有终端。')) return;
        try {
          await api('/api/events/' + btn.dataset.id, { method: 'DELETE' });
          toast('事件已删除');
          loadEvents();
        } catch (err) { toast('删除失败：' + err.message, false); }
      };
    });
    tbody.querySelectorAll('.ev-edit').forEach((btn) => {
      btn.onclick = () => {
        const ev = monthEvents.find((x) => x.id === btn.dataset.id);
        if (ev) openModal(ev);
      };
    });
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="5" class="muted">加载失败：${err.message}</td></tr>`;
    $('events-count').textContent = '—';
  }
}

/* ---------------- 弹窗表单 ---------------- */
function openModal(event = null) {
  editingEvent = event;
  $('modal-title').textContent = event ? '编辑事件' : '添加事件';
  if (event) {
    $('event-title').value = event.title;
    if ($('event-calendar').querySelector(`option[value="${event.calendar_id}"]`)) {
      $('event-calendar').value = event.calendar_id;
    }
    $('event-start').value = toLocalInput(event.start_at);
    $('event-end').value = toLocalInput(event.end_at);
    $('event-allday').checked = !!event.all_day;
    $('event-location').value = event.location || '';
    $('event-description').value = event.description || '';
    $('event-reminder').value = event.reminder_minutes != null ? String(event.reminder_minutes) : '';
    $('event-recurrence').value = event.recurrence || '';
  } else {
    $('event-form').reset();
    const base = selectedDate || new Date(currentYear, currentMonth, Math.min(new Date().getDate(), 28), 0, 0);
    const y = base.getFullYear(), m = base.getMonth(), d = base.getDate();
    $('event-start').value = toLocalInput(new Date(y, m, d, 9, 0).getTime());
    $('event-end').value = toLocalInput(new Date(y, m, d, 10, 0).getTime());
  }
  $('event-modal').classList.add('active');
}
function closeModal() {
  $('event-modal').classList.remove('active');
  editingEvent = null;
}

$('event-form').onsubmit = async (e) => {
  e.preventDefault();
  const startAt = new Date($('event-start').value).getTime();
  const endAt = new Date($('event-end').value).getTime();
  if (!(endAt > startAt)) return toast('结束时间必须晚于开始时间', false);
  const payload = {
    calendar_id: $('event-calendar').value || 'default',
    title: $('event-title').value.trim(),
    start_at: startAt,
    end_at: endAt,
    all_day: $('event-allday').checked,
    location: $('event-location').value.trim(),
    description: $('event-description').value.trim(),
    reminder_minutes: $('event-reminder').value ? parseInt($('event-reminder').value, 10) : null,
    recurrence: $('event-recurrence').value || null,
  };
  try {
    if (editingEvent) {
      await api('/api/events/' + editingEvent.id, { method: 'PUT', body: JSON.stringify(payload) });
      toast('事件已更新');
    } else {
      await api('/api/events', { method: 'POST', body: JSON.stringify(payload) });
      toast('事件已添加');
    }
    closeModal();
    loadEvents();
  } catch (err) {
    toast('保存失败：' + err.message, false);
  }
};

/* ---------------- 事件绑定 ---------------- */
$('prev-month').onclick = () => shiftMonth(-1);
$('next-month').onclick = () => shiftMonth(1);
$('today-btn').onclick = () => {
  const t = new Date();
  currentYear = t.getFullYear();
  currentMonth = t.getMonth();
  selectedDate = null;
  syncYearMonthSelects();
  renderCalendar();
  loadEvents();
};
$('year-select').onchange = () => {
  currentYear = parseInt($('year-select').value, 10);
  renderCalendar();
  loadEvents();
};
$('month-select').onchange = () => {
  currentMonth = parseInt($('month-select').value, 10);
  renderCalendar();
  loadEvents();
};
$('calendar-filter').onchange = loadEvents;
let searchTimer = null;
$('search-input').oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadEvents, 300);
};
$('add-event-btn').onclick = () => openModal();
$('close-modal').onclick = closeModal;
$('cancel-btn').onclick = closeModal;
$('event-modal').onclick = (e) => { if (e.target === $('event-modal')) closeModal(); };

/* ---------------- 初始化 ---------------- */
populateYearMonth();
renderCalendar();
loadCalendars().catch((e) => toast('日历加载失败：' + e.message, false));
loadEvents();
</script>
</body>
</html>
